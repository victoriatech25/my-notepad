name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest   # 주석: 리눅스에서 검사
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: "pnpm test:e2e"
    timeout-minutes: 30
    continue-on-error: false
