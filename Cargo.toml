[package]
name = "my-notepad"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Notepad++ 스타일의 경량 크로스 플랫폼 로컬 텍스트 에디터"

[dependencies]
chardetng = "1.0.0"
# egui/eframe은 마이너 버전마다 Breaking Change가 잦으므로 정확한 버전으로 고정한다 (PLAN.md §2.1).
# Phase 0 결정(P0-07, P0-10): 본 앱은 glow 렌더러만 사용하고 wgpu는 제외해 메모리와 실행 파일 크기를 줄인다.
eframe = { version = "=0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
encoding_rs = "0.8.42"
# 사이드바 .gitignore 판정 (PLAN.md §2.2, §3.1-3)
ignore = "0.4.33"
log = "0.4.34"
memmap2 = "0.9.11"
# 네이티브 파일 열기/저장 대화상자 (PLAN.md §2.2)
rfd = "0.17.2"
# 설정 파일 settings.toml 읽기·쓰기 (P2-08)
serde = { version = "1.0.229", features = ["derive"] }
# 원자적 저장: 같은 폴더의 임시 파일에 쓰고 rename (PLAN.md §2.2, §3.6)
tempfile = "3.27.0"
# 파일·폴더 아이콘 매핑 표 assets/file-icons/icons.toml 읽기 (§3.1-3)
toml = "1.1.8"
ttf-parser = "0.25.1"

[workspace]
resolver = "3"
members = [
    ".",
    "xtask",
    "spikes/editor-spike",
    "spikes/ux-prototype",
    "spikes/md-spike",
]
default-members = ["."]
# 패치한 외부 크레이트 사본은 워크스페이스 멤버가 아니다 (우리 clippy·fmt 규칙을 적용하지 않는다).
exclude = ["third_party/winit-0.30.13"]

# macOS 한글 2벌식에서 입력 소스 전환 직후 첫 키가 조합되지 않고 낱자로 들어오는 winit 결함(winit#3095)을
# upstream 수정 winit#4744를 0.30.13에 백포트해 고친다. eframe이 쓰는 winit 배포판에 수정이 들어오면 제거한다.
# 상세: third_party/README.md
[patch.crates-io]
winit = { path = "third_party/winit-0.30.13" }

[workspace.package]
edition = "2024"
rust-version = "1.98"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
